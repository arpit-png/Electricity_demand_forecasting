<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Rounded Rect -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#gridGrad)" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Grid Coordinates lines -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#93c5fd" stroke-width="1" stroke-dasharray="2,2" stroke-opacity="0.4" />
  <line x1="32" y1="12" x2="32" y2="52" stroke="#93c5fd" stroke-width="1" stroke-dasharray="2,2" stroke-opacity="0.4" />

  <!-- Duck Curve Net Demand Contour -->
  <path d="M 12 28 Q 20 28 26 44 T 40 44 Q 46 20 52 18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Evening Ramp Spark Symbol -->
  <polygon points="34,16 26,30 32,30 30,44 42,28 36,28" fill="url(#amberGrad)" filter="url(#glow)" />
</svg>
